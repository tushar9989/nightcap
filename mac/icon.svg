<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2a9e94"/>
      <stop offset="1" stop-color="#0a4a4e"/>
    </linearGradient>
    <!-- the beam: a soft glow from beyond the lower-left corner, stretched along its path and
         fading into the background on every side -->
    <radialGradient id="beam" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1"
        gradientTransform="translate(-20 530) rotate(-42) scale(720 250)">
      <stop offset="0" stop-color="#fff2d6" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#fff2d6" stop-opacity="0.34"/>
      <stop offset="0.78" stop-color="#fff2d6" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#fff2d6" stop-opacity="0"/>
    </radialGradient>
    <!-- the moon: solid white, lit a touch warmer where the beam reaches it -->
    <linearGradient id="moon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fff1d2"/>
      <stop offset="0.6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f6f6"/>
    </linearGradient>
    <clipPath id="tile"><rect x="28" y="28" width="456" height="456" rx="104"/></clipPath>
    <mask id="cres">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="318" cy="206" r="128" fill="#000"/>
    </mask>
  </defs>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="512" height="512" fill="url(#beam)"/>
    <circle cx="256" cy="264" r="158" fill="url(#moon)" mask="url(#cres)"/>
  </g>
</svg>
